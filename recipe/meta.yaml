{% set name = "pdir2" %}
{% set version = "1.1.3" %}
{% set hash = "8db5a4c23b54e90ca0babeae6a4e0b8ead8919a91369a6f00bf4d2b15c46b0cd" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/p/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - pdm-backend
    - python {{ python_min }}
    - pip

  run:
    - python >={{ python_min }}
    - typing-extensions
    - colorama

test:
  requires:
    - python {{ python_min }}
  imports:
    - pdir

about:
  home: http://github.com/laike9m/pdir2
  license: MIT
  license_file: LICENSE
  summary: Pretty dir printing with joy
  license_family: MIT

extra:
  recipe-maintainers:
    - nicoddemus
